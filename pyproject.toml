[project]
name = "video-harness"
version = "0.1.0"
description = "AI-driven video editing harness: footage catalog, voiceover, captions, conform, Remotion render, QA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "numpy>=1.26",
  "httpx>=0.27",
  "faster-whisper>=1.0.3",
  "av>=12,<16",
]

[project.optional-dependencies]
download = ["yt-dlp>=2024.10.0"]

[project.scripts]
vh = "vh.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vh"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
