name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: [python, renderer]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: uv sync --locked
      - run: cd renderer && npm ci
      - run: uv run python scripts/make_demo.py /tmp/demo
      - run: uv run vh build /tmp/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-render
          path: |
            /tmp/demo/out/final.mp4
            /tmp/demo/out/qa.json
            /tmp/demo/out/qa/
          if-no-files-found: ignore
